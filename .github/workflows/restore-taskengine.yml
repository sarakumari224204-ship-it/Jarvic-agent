name: Restore Full TaskEngine

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_taskengine.py'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch TaskEngine from 2884e01 base
        run: |
          set -euo pipefail
          python3 scripts/patch_taskengine.py
          BYTES=$(wc -c < app/src/main/java/com/jarvis/os/domain/agent/TaskEngine.kt)
          LINES=$(wc -l < app/src/main/java/com/jarvis/os/domain/agent/TaskEngine.kt)
          echo "Assembled lines=$LINES bytes=$BYTES"
          test "$BYTES" -gt 25000
          test "$LINES" -gt 500
          grep -q MODE_SCREEN_READ app/src/main/java/com/jarvis/os/domain/agent/TaskEngine.kt
          grep -q MessageSendGuard app/src/main/java/com/jarvis/os/domain/agent/TaskEngine.kt
          grep -q buildScreenReadContext app/src/main/java/com/jarvis/os/domain/agent/TaskEngine.kt
          grep -q 'globalAction(GlobalCommand.HOME)' app/src/main/java/com/jarvis/os/domain/agent/TaskEngine.kt
          ! grep -q 'Agent loop incomplete' app/src/main/java/com/jarvis/os/domain/agent/TaskEngine.kt
          sha256sum app/src/main/java/com/jarvis/os/domain/agent/TaskEngine.kt

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/jarvis/os/domain/agent/TaskEngine.kt
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Restore full TaskEngine + MODE_SCREEN_READ (from 2884e01 + patch)"
          git push origin HEAD:main
